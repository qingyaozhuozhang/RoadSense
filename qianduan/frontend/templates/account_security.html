{% extends 'base.html' %}{% block title %}账号安全{% endblock %}{% block breadcrumb %}账号安全{% endblock %}{% block content %}<section class="rs-admin-card"><h1>账号安全 · 修改密码</h1><p>当前账号：{{ current_user.username }}。数据库不会保存明文密码。</p><form method="post" action="/account/security" style="max-width:550px;display:grid;gap:12px"><input type="hidden" name="csrf_token" value="{{ csrf_token }}"><label for="old">当前密码</label><input id="old" name="current_password" type="password" required autocomplete="current-password"><label for="new">新密码（至少10位、包含字母和数字）</label><input id="new" name="new_password" type="password" required minlength="10" maxlength="128" autocomplete="new-password"><label for="confirm">确认新密码</label><input id="confirm" name="new_password_confirm" type="password" required minlength="10" maxlength="128" autocomplete="new-password"><button type="submit" class="rs-action-button">修改密码</button></form></section><script>document.querySelector('form[action="/account/security"]').addEventListener('submit',function(e){if(document.getElementById('new').value!==document.getElementById('confirm').value){e.preventDefault();alert('两次输入的新密码不一致');}})</script>{% endblock %}
