<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1"><style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#ecf5fc;font-family:system-ui,'Microsoft YaHei',sans-serif}#map{position:absolute;inset:0;width:100%;height:100%;min-height:0;background:#e6f3fd}#waiting{position:absolute;inset:0;z-index:3;display:flex;flex-direction:column;justify-content:center;align-items:center;gap:9px;background:linear-gradient(135deg,#eff8fe,#e1f5f3);text-align:center;color:#315b77;font-size:12px;pointer-events:none}#waiting strong{font-size:15px}#waiting i{font-size:39px;font-style:normal;color:#268dc9}.rs-map-message{position:absolute;inset:0;z-index:5;display:grid;place-items:center;padding:20px;text-align:center;background:#eff7fc;color:#31617f}.rs-map-message[hidden]{display:none}.rs-map-pin{width:22px;height:22px;border:4px solid #fff;background:#157ed9;border-radius:50%;box-shadow:0 0 0 9px #157edd38,0 5px 14px #0003}.rs-center-button{position:absolute;bottom:12px;left:12px;z-index:10;border:0;border-radius:10px;background:white;color:#1c6da0;padding:9px;font-weight:700}

/* An Android map page does not inherit the desktop stylesheet. Without this
   the dynamically created AMap div has zero height and renders a blank tile. */
.rs-amap-canvas{position:absolute!important;inset:0!important;width:100%!important;height:100%!important;min-height:255px;overflow:hidden}
#map>.rs-amap-canvas{z-index:1}
#map .rs-map-message{z-index:6}
#map .rs-center-button{z-index:7}
#waiting{transition:opacity .15s ease}
</style></head><body><div id="map"></div><div id="waiting"><i>⌖</i><strong>等待高德原生定位</strong><span>开始上报后，将在此显示实时道路地图</span></div>
<script src="{{ url_for('static', filename='js/live_map.js') }}"></script><script>
const rsMap=window.createRoadSenseMap('map',{source:'phone'});window.nativeUpdateMap=function(lon,lat){if(Number.isFinite(+lon)&&Number.isFinite(+lat)){document.getElementById('waiting').style.display='none';rsMap.update(+lon,+lat);}};
</script></body></html>
