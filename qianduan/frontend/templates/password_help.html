<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>找回密码 · 道路智能巡检平台</title><style>body{font-family:system-ui,sans-serif;background:#eef5fb;color:#183551;margin:0;display:grid;min-height:100vh;place-items:center}.card{background:white;max-width:500px;padding:32px;border-radius:18px;box-shadow:0 20px 70px #17314a21;line-height:1.8}a{color:#028cab}</style></head><body><main class="card"><h1>忘记密码</h1><p>为了保护账号安全，系统不会显示或找回原密码（数据库仅保存不可逆的密码哈希）。</p><p>目前未配置短信或邮箱验证服务，请联系平台管理员。管理员可在「设备与数据管理 → 用户权限管理」中为普通用户生成一次性的新密码。</p><p>收到新密码后，登录并通过「账号安全」修改密码。请不要将新密码发送到公开群聊。</p><a href="/login">返回登录页面</a></main></body></html>
